# Builds Wizard's Castle for the Asciiverse catalog: one archive per
# target, named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus
# a SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v1.0.11-av.1: upstream's Cargo.toml version, then our
# release. Pure Rust (Ratatui on crossterm), no native libraries. Linux
# builds run in Alpine, so the binaries are static (musl). Rust is pinned
# to 1.93.1. The crate's binary, wizards_castle_ncurses, is shipped as
# wizards-castle. The release step publishes whatever built.

name: asciiverse-release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: wizards-castle
  BIN: wizards_castle_ncurses
  RUST: "1.93.1"
  TAG: ${{ inputs.tag || github.ref_name }}
  DOCS: LICENSE.md README.md PATCHES.md wizcasn.6

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:$RUST-alpine sh -c '
            apk add --no-cache musl-dev &&
            cargo test --release --locked &&
            cargo build --release --locked &&
            strip target/release/'"$BIN"
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/$BIN

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/release/$BIN stage/$ID
          cp $DOCS stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup toolchain install $RUST --profile minimal --target ${{ matrix.target }}
          cargo +$RUST build --release --locked --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/$BIN
          file target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN stage/$ID
          cp $DOCS stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup toolchain install $RUST --profile minimal --target ${{ matrix.target }}
          cargo +$RUST build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN.exe stage/$ID.exe
          cp $DOCS stage/
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Wizard's Castle $TAG" \
                 --notes "Wizard's Castle by Brian \"Beej Jorgensen\" Hall (github.com/beejjorgensen/Wizards-Castle-Ncurses), after Joseph R. Power's 1980 game, moved to Ratatui and built for the Asciiverse catalog: one binary for Linux, macOS and Windows. MIT. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
